<nav
  class="fixed top-0 left-0 h-screen w-64 bg-slate-950 border-r border-cyan-500/20 flex flex-col p-6 z-50"
>
  <a routerLink="/" class="mb-8 text-xl font-bold text-cyan-400 tracking-wider">KI·LERNAPP</a>

  <div class="flex flex-col gap-1">
    @for (chapter of chapters; track chapter.path) {
      <a
        [routerLink]="chapter.path"
        routerLinkActive="bg-cyan-500/10 text-cyan-300 border-cyan-400"
        class="px-4 py-2 rounded-md text-sm text-slate-400 border border-transparent hover:text-cyan-300 hover:border-cyan-500/30 transition-colors"
        >{{ chapter.label }}</a
      >
    }
  </div>
</nav>
