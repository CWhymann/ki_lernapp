<div>
  <h1
    class="text-3xl font-bold text-cyan-300 mb-2"
    style="text-shadow: 0 0 15px rgba(34, 211, 238, 0.5)"
  >
    Willkommen bei der KI·LERNAPP von Studio Wiemann
  </h1>
  <p class="text-slate-400 mb-10">
    Wähle ein Kapitel, um zu verstehen, wie KI wirklich funktioniert.
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (card of cards; track card.path) {
      <a
        [routerLink]="card.path"
        class="block p-6 rounded-xl bg-slate-800/50 border border-slate-700 hover:border-cyan-400 hover:bg-slate-800 hover:shadow-[0_0_25px_rgba(34,211,238,0.15)] transition-all group"
      >
        <div class="text-3xl mb-3">{{ card.icon }}</div>
        <h2 class="text-lg font-semibold text-slate-100 group-hover:text-cyan-300 mb-2">
          {{ card.title }}
        </h2>
        <p class="text-sm text-slate-400">{{ card.description }}</p>
      </a>
    }
  </div>
</div>
